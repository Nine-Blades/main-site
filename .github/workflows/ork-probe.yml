name: ORK fetch probe

# One-off diagnostic. Answers a single question before we build the real
# event-prerender pipeline: can a GitHub Actions runner fetch the Amtgard ORK
# events endpoint, or does Cloudflare challenge it?
#
# Trigger it by hand: Actions tab -> "ORK fetch probe" -> Run workflow.
# Job GREEN  = ORK reachable from CI (plain fetch works).
# Job RED    = Cloudflare blocked it (see the log for the verdict + next steps).
#
# It only reads from the ORK and never touches the repo. Delete this file and
# scripts/ork-probe.mjs once you have the answer.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner egress IP (useful if an ORK IP/ASN allowlist is the only option)
        run: curl -s https://api.ipify.org && echo

      - name: Probe the ORK events endpoint
        env:
          # Add this as a repository secret; CI masks it in the logs.
          ORK_BUILD_KEY: ${{ secrets.ORK_BUILD_KEY }}
        run: node scripts/ork-probe.mjs
