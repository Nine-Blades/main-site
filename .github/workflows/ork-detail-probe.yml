name: ORK detail probe

# One-off (Path B): discover the ORK JSON endpoint for a single event's full
# detail — end date, full description, venue/address, fee. Trigger from the
# Actions tab. Reads only; delete this and scripts/ork-detail-probe.mjs once we
# know the call.

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'ORK EventId to inspect'
        default: '18686'
      detail_id:
        description: 'ORK NextDetailId to inspect'
        default: '9245'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe event-detail endpoints
        env:
          ORK_BUILD_KEY: ${{ secrets.ORK_BUILD_KEY }}
          EVENT_ID: ${{ inputs.event_id }}
          DETAIL_ID: ${{ inputs.detail_id }}
        run: node scripts/ork-detail-probe.mjs
